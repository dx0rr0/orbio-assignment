name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: claims
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claims" --health-interval 2s --health-retries 20
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Inline suppressions are not allowed: noqa comments are ignored, and any kind fails.
      - run: uv run python scripts/check_suppressions.py
      - run: uv run ruff check --ignore-noqa .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # e2e tests need real providers and the running stack; they are excluded by default.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
