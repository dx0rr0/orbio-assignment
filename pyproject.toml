[project]
name = "claims-agent"
version = "0.1.0"
description = "Voice agent that takes the first notice of loss for a fictional car insurer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "httpx>=0.28.1",
    "langfuse>=5.0.3",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.11",
    "redis>=8.1.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "daphne>=4.2.3",
    "mypy>=2.4.0",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.1",
    "ruff>=0.12",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "claims_service.settings"
# `uv run pytest` works without an .env file; "D:" keeps a value already set.
env = ["D:DJANGO_SECRET_KEY=test-only-insecure-key"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = ["e2e: hits real providers; run on demand with `pytest -m e2e`"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django declares model options as class attributes.
"**/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
files = ["src", "evals", "scripts"]
exclude = ["/migrations/"]
# Django, Celery and Channels ship no type information; checking against them is out of scope.
[[tool.mypy.overrides]]
module = ["django.*", "celery.*", "channels.*", "ninja.*"]
ignore_missing_imports = true
