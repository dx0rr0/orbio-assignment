[project]
name = "claims-agent"
version = "0.1.0"
description = "Voice agent that takes the first notice of loss for a fictional car insurer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "httpx>=0.28.1",
    "httpx2>=2.15.1",
    "langfuse>=5.0.3",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.11",
    "redis>=8.1.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "daphne>=4.2.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.1",
    "ruff>=0.12",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "claims_service.settings"
# `uv run pytest` works without an .env file; "D:" keeps a value already set.
env = ["D:DJANGO_SECRET_KEY=test-only-insecure-key"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = ["e2e: hits real providers; run on demand with `pytest -m e2e`"]

[tool.importlinter]
root_packages = ["claims_agent", "claims_service"]
include_external_packages = true

# Hexagonal layers (docs/adr): the domain depends on nothing, ports on the domain, the engine
# on ports and domain, adapters implement ports; the Django service wires them at the edge.
[[tool.importlinter.contracts]]
name = "Core layers depend inwards"
type = "layers"
containers = ["claims_agent"]
layers = ["adapters | engine", "ports", "domain"]

[[tool.importlinter.contracts]]
name = "The core knows nothing of the service or its frameworks"
type = "forbidden"
source_modules = ["claims_agent"]
forbidden_modules = ["claims_service", "django", "channels", "celery", "ninja"]

[[tool.importlinter.contracts]]
name = "Only adapters talk to providers"
type = "forbidden"
source_modules = ["claims_agent.domain", "claims_agent.ports", "claims_agent.engine"]
forbidden_modules = ["httpx", "openai", "langfuse"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# Inline suppressions are not allowed (CI runs ruff with --ignore-noqa and
# scripts/check_suppressions.py); the exceptions below are the only ones, by file.
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET", "PERF", "FURB", "ISC",
    "ANN",     # annotated signatures
    "S",       # security, and no `assert` outside tests
    "BLE",     # no blind `except Exception` unless the exception is logged
    "ASYNC",   # no blocking calls in async code
    "DTZ",     # no naive datetimes
    "PTH",     # pathlib
    "T20",     # no print outside the command-line tools
    "ERA",     # no commented-out code
    "PGH",     # no blanket `type: ignore` / `noqa`
    "TID",     # banned APIs, below
    "SLF",     # no private member access from outside
    "LOG", "G",
    "FBT001", "FBT002",  # no positional boolean parameters
    "PLW",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Type the value properly instead of casting it."
"typing.Any".msg = "Type it precisely: `object`, a TypedDict, a model or pydantic's `JsonValue`."

[tool.ruff.lint.per-file-ignores]
# Django declares model options as class attributes.
"**/models.py" = ["RUF012"]
# pytest asserts, and test functions need no annotations (but none may be `Any`, ANN401).
"tests/**" = [
    "S101", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
]
# Command-line tools: printing is their output.
"scripts/**" = ["T201"]
"evals/**" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
# No explicit `Any` (ruff bans importing it too); untyped frameworks are handled below.
disallow_any_explicit = true
# Without it, mypy reads pydantic's dataclass transform as an `__init__(**data: Any)` on
# every model, which the rule above rejects.
plugins = ["pydantic.mypy"]
files = ["src", "evals", "scripts"]
exclude = ["/migrations/"]
# Django, Celery and Channels ship no type information; checking against them is out of scope.
[[tool.mypy.overrides]]
module = ["django.*", "celery.*", "channels.*", "ninja.*"]
ignore_missing_imports = true
# Their base classes and decorators are untyped, so the service layer may subclass and use them.
[[tool.mypy.overrides]]
module = ["claims_service.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
