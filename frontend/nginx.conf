# Serves the built app and proxies the API and WebSocket to the backend, so the browser
# talks to a single origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the backend through Docker's DNS at request time (a variable in proxy_pass
    # forces it), so a recreated backend container with a new IP keeps working.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A turn can take a while (STT + LLM + TTS); keep idle sockets open between turns.
        proxy_read_timeout 15m;
    }

    location / {
        try_files $uri /index.html;
    }
}
